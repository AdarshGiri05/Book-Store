<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <nav>
        <div class="bg-blue-500 text-white flex justify-around p-4">
            <h1 class="text-2xl font-bold">Bookstore</h1>
            <div class="flex gap-8 text-lg font-semibold">
                <a href="/">Home</a>
                <a href="/books">Books</a>
                <a href="/category">Categories</a>
                <a href="/cart">Cart</a>
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
            </div>
        </div>
</nav>

    <div class="max-w-5xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold mb-6">Your Cart</h1>

        
            <div class="space-y-4">
                
                    <div class="bg-white rounded-xl shadow-md p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <img src="/img1.png" alt="Atomic Habits" class="w-20 h-20 object-contain rounded-lg bg-gray-50 border border-gray-200 p-2">
                            <div>
                                <h2 class="text-xl font-bold">Atomic Habits</h2>
                                <p class="text-gray-600">Quantity: 1</p>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end gap-3">
                            <div>
                                <p class="text-lg font-semibold">₹499 each</p>
                                <p class="text-gray-600">Subtotal: ₹499</p>
                            </div>
                            <div class="flex gap-2">
                                <a href="/cart/decrease/6aba8845fc4b5f339359269d" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-1.5 px-3 rounded-md text-sm">
                                    -1
                                </a>
                                <a href="/cart/remove/6aba8845fc4b5f339359269d" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-1.5 px-3 rounded-md text-sm">
                                    Remove
                                </a>
                            </div>
                        </div>
                    </div>
                
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 mt-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-2xl font-bold">Total: ₹499</h2>
                <div class="flex gap-3">
                    <a href="/books" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-md">
                        Keep Shopping
                    </a>
                    <a href="/contact" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md">
                        Proceed to Contact
                    </a>
                </div>
            </div>
        
    </div>

    <footer class="bg-blue-400 text-white mt-10">
    <div class="p-6 flex justify-between">
        <h2 class="text-xl font-bold">Bookstore</h2>
        <div class="flex gap-6 font-semibold">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">X</a>
            <a href="#">Email</a>
        </div>
    </div>
    <div class="border-t border-white-400 text-center p-3 text-sm">
        © 2026 Bookstore. All Rights Reserved.
    </div>
</footer>
</body>
</html>
